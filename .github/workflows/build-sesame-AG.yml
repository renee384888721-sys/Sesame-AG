name: Sesame-AG 安装包构建
run-name: ${{ github.actor }} 触发的构建 | ${{ github.event_name }}

on:
  push:
    branches: [ main, master, dev ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # 每天北京时间早上8点自动检测更新

concurrency:
  group: sesame-ag-release
  cancel-in-progress: false

env:
  CI: "true"
  TZ: Asia/Shanghai
  JAVA_DISTRIBUTION: "temurin"
  JAVA_VERSION: "17"
  ANDROID_API_LEVEL: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"
  RELEASE_DIR: app/build/outputs/apk/release
  STAGING_DIR: app/build/outputs/apk/all
  ASSET_DIR: app/build/outputs/apk/release-assets
  UPSTREAM_REPO: https://github.com/Sesame-AG/Sesame-AG.git

jobs:
  # 任务1：只检测上游是否有新提交，不把上游代码合并进 fork
  sync-upstream:
    runs-on: ubuntu-latest
    outputs:
      has_update: ${{ steps.check_update.outputs.has_update }}
      upstream_short: ${{ steps.check_update.outputs.upstream_short }}
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 拉取上游并检测更新
        id: check_update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "${UPSTREAM_REPO}"
          git fetch --no-tags upstream dev main

          UPSTREAM_SHA=$(git rev-parse upstream/dev)
          UPSTREAM_SHORT=$(git rev-parse --short upstream/dev)
          echo "upstream_short=${UPSTREAM_SHORT}" >> "$GITHUB_OUTPUT"

          LATEST_TAG=$(curl -sS -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${REPO}/releases/latest" \
            | jq -r '.tag_name // empty') || LATEST_TAG=""
          PREV_SHORT="${LATEST_TAG##*-}"

          if [ -n "$LATEST_TAG" ] && [ "$PREV_SHORT" = "$UPSTREAM_SHORT" ]; then
            echo "has_update=false" >> "$GITHUB_OUTPUT"
            : > changelog.txt
            echo "上游 dev 仍是 ${UPSTREAM_SHORT}，与最新 Release 相同" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "has_update=true" >> "$GITHUB_OUTPUT"

          if [ -n "$PREV_SHORT" ] && git cat-file -e "${PREV_SHORT}^{commit}" 2>/dev/null; then
            CHANGE_LOG=$(git log --oneline "${PREV_SHORT}..upstream/dev" 2>/dev/null || git log --oneline -20 upstream/dev)
          else
            CHANGE_LOG=$(git log --oneline -20 upstream/dev)
          fi
          printf '%s\n' "$CHANGE_LOG" > changelog.txt

          echo "上游 dev 更新到 ${UPSTREAM_SHORT}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$CHANGE_LOG" | sed '/^$/d; s/^/- /' >> "$GITHUB_STEP_SUMMARY"

      - name: 上传更新日志
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: changelog.txt
          if-no-files-found: ignore

  # 任务2：上游代码 + patches/ 打补丁后构建，补丁失败则中止发版
  build-and-sign:
    runs-on: ubuntu-latest
    needs: sync-upstream
    permissions:
      contents: write
    outputs:
      version: ${{ steps.prepare_assets.outputs.version }}
      tag_name: ${{ steps.prepare_assets.outputs.tag_name }}
      build_time: ${{ steps.prepare_assets.outputs.build_time }}
      dev_latest_commit: ${{ steps.prepare_assets.outputs.dev_latest_commit }}
      dev_latest_commit_msg: ${{ steps.prepare_assets.outputs.dev_latest_commit_msg }}
      dev_latest_commit_time: ${{ steps.prepare_assets.outputs.dev_latest_commit_time }}
      main_latest_commit: ${{ steps.prepare_assets.outputs.main_latest_commit }}
      main_latest_commit_msg: ${{ steps.prepare_assets.outputs.main_latest_commit_msg }}
      main_latest_commit_time: ${{ steps.prepare_assets.outputs.main_latest_commit_time }}
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      needs.sync-upstream.outputs.has_update == 'true'
    steps:
      - name: 检出 fork 代码（含 patches/）
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 基于上游 dev 应用自定义补丁
        id: apply_patches
        run: |
          echo "## 自定义补丁应用状态" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          shopt -s nullglob
          patch_files=(patches/*.patch)
          if [ ${#patch_files[@]} -eq 0 ]; then
            echo "当前分支没有 patches/*.patch，无法继续构建" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          PATCH_BACKUP=$(mktemp -d)
          cp -a patches "$PATCH_BACKUP/patches"

          git remote remove upstream 2>/dev/null || true
          git remote add upstream "${UPSTREAM_REPO}"
          git fetch --no-tags upstream dev main
          git checkout -f upstream/dev

          rm -rf patches
          cp -a "$PATCH_BACKUP/patches" patches

          FAILED=0
          APPLIED=0
          for patch_file in patches/*.patch; do
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### 补丁: $(basename "$patch_file")" >> "$GITHUB_STEP_SUMMARY"

            TARGET_FILE=$(grep -m1 '^+++ b/' "$patch_file" | sed 's/^+++ b\///')
            if [ -z "$TARGET_FILE" ]; then
              echo "无法解析补丁目标文件" >> "$GITHUB_STEP_SUMMARY"
              FAILED=1
              continue
            fi
            if [ ! -f "$TARGET_FILE" ]; then
              echo "目标文件不存在: \`$TARGET_FILE\`" >> "$GITHUB_STEP_SUMMARY"
              FAILED=1
              continue
            fi

            APPLY_OUTPUT=$(git apply --verbose "$patch_file" 2>&1)
            APPLY_EXIT=$?
            if [ $APPLY_EXIT -ne 0 ]; then
              APPLY_OUTPUT=$(git apply --3way --verbose "$patch_file" 2>&1)
              APPLY_EXIT=$?
            fi

            if [ $APPLY_EXIT -eq 0 ]; then
              echo "应用成功 -> \`$TARGET_FILE\`" >> "$GITHUB_STEP_SUMMARY"
              APPLIED=$((APPLIED + 1))
            else
              echo "应用失败" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              echo "$APPLY_OUTPUT" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              FAILED=1
            fi
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### 汇总" >> "$GITHUB_STEP_SUMMARY"
          echo "- 成功: $APPLIED" >> "$GITHUB_STEP_SUMMARY"
          echo "- 失败: $FAILED" >> "$GITHUB_STEP_SUMMARY"

          if [ "$FAILED" -ne 0 ]; then
            echo "补丁未全部应用，停止发版" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: 安装JDK环境
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: 配置Gradle的Java路径
        run: echo "ORG_GRADLE_JAVA_HOME=${JAVA_HOME}" >> "$GITHUB_ENV"

      - name: 安装Android SDK工具
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: 安装SDK组件并接受协议
        run: |
          sdkmanager --install "platform-tools" "platforms;android-${ANDROID_API_LEVEL}" "build-tools;${ANDROID_BUILD_TOOLS}"
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail

      - name: 配置Gradle缓存（加速构建）
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: false
          cache-cleanup: on-success

      - name: 赋予Gradle执行权限
        run: chmod +x gradlew

      - name: 执行Release构建
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: 准备待签名的APK文件
        run: |
          rm -rf "${STAGING_DIR}" "${ASSET_DIR}"
          mkdir -p "${STAGING_DIR}"
          mapfile -t apks < <(find "${RELEASE_DIR}" -maxdepth 1 -type f -name "*.apk" | sort)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "未找到 Release APK: ${RELEASE_DIR}"
            exit 1
          fi
          for apk in "${apks[@]}"; do
            cp "${apk}" "${STAGING_DIR}/"
          done

      - name: 对APK进行签名
        id: sign_apks
        uses: ilharp/sign-android-release@v2
        with:
          releaseDir: ${{ env.STAGING_DIR }}
          signingKey: ${{ secrets.KEYSTORE_BASE64 }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: ${{ env.ANDROID_BUILD_TOOLS }}

      - name: 显示签名完成的文件列表
        run: |
          echo "## 成功签名以下APK文件" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.sign_apks.outputs.signedFiles }}" | tr ':' '\n' | sed '/^$/d; s|.*/||; s/^/- /' >> "$GITHUB_STEP_SUMMARY"

      - name: 生成SHA256校验文件与版本信息
        id: prepare_assets
        run: |
          mkdir -p "${ASSET_DIR}"
          IFS=':' read -r -a files <<< "${{ steps.sign_apks.outputs.signedFiles }}"
          for file in "${files[@]}"; do
            [ -n "$file" ] || continue
            cp "${file}" "${ASSET_DIR}/"
            (
              cd "${ASSET_DIR}"
              sha256sum "$(basename "${file}")" > "CHECKSUMS-$(basename "${file}").sha256"
            )
          done

          VERSION=$(sed -n 's/^appVersion=//p' gradle.properties | head -n1 | tr -d '\r')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          SHORT_SHA=$(git rev-parse --short HEAD)
          DATE=$(date '+%Y%m%d')
          echo "tag_name=v${VERSION}-${DATE}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date '+%Y-%m-%d %H:%M:%S')" >> "$GITHUB_OUTPUT"

          DEV_SHA=$(git rev-parse --short upstream/dev)
          DEV_MSG=$(git log --oneline -1 upstream/dev | cut -d' ' -f2-)
          DEV_TIME=$(git log -1 --format="%ci" upstream/dev)
          echo "dev_latest_commit=${DEV_SHA}" >> "$GITHUB_OUTPUT"
          echo "dev_latest_commit_msg=${DEV_MSG}" >> "$GITHUB_OUTPUT"
          echo "dev_latest_commit_time=${DEV_TIME}" >> "$GITHUB_OUTPUT"

          MAIN_SHA=$(git rev-parse --short upstream/main)
          MAIN_MSG=$(git log --oneline -1 upstream/main | cut -d' ' -f2-)
          MAIN_TIME=$(git log -1 --format="%ci" upstream/main)
          echo "main_latest_commit=${MAIN_SHA}" >> "$GITHUB_OUTPUT"
          echo "main_latest_commit_msg=${MAIN_MSG}" >> "$GITHUB_OUTPUT"
          echo "main_latest_commit_time=${MAIN_TIME}" >> "$GITHUB_OUTPUT"

      - name: 下载更新日志
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: changelog

      - name: 生成Release说明文件
        env:
          VERSION: ${{ steps.prepare_assets.outputs.version }}
          BUILD_TIME: ${{ steps.prepare_assets.outputs.build_time }}
          EVENT_NAME: ${{ github.event_name }}
          DEV_LATEST_COMMIT: ${{ steps.prepare_assets.outputs.dev_latest_commit }}
          DEV_LATEST_COMMIT_MSG: ${{ steps.prepare_assets.outputs.dev_latest_commit_msg }}
          DEV_LATEST_COMMIT_TIME: ${{ steps.prepare_assets.outputs.dev_latest_commit_time }}
          MAIN_LATEST_COMMIT: ${{ steps.prepare_assets.outputs.main_latest_commit }}
          MAIN_LATEST_COMMIT_MSG: ${{ steps.prepare_assets.outputs.main_latest_commit_msg }}
          MAIN_LATEST_COMMIT_TIME: ${{ steps.prepare_assets.outputs.main_latest_commit_time }}
          HAS_UPDATE: ${{ needs.sync-upstream.outputs.has_update }}
        run: |
          {
            echo "## 构建信息"
            echo "- 版本号：v${VERSION}"
            echo "- 构建时间：${BUILD_TIME}"
            echo "- 触发来源：${EVENT_NAME}"
            echo ""
            echo "## 原仓库最新提交"
            echo ""
            echo "### dev 分支"
            echo "- 提交哈希：\`${DEV_LATEST_COMMIT}\`"
            echo "- 提交说明：${DEV_LATEST_COMMIT_MSG}"
            echo "- 提交时间：${DEV_LATEST_COMMIT_TIME}"
            echo ""
            echo "### main 分支"
            echo "- 提交哈希：\`${MAIN_LATEST_COMMIT}\`"
            echo "- 提交说明：${MAIN_LATEST_COMMIT_MSG}"
            echo "- 提交时间：${MAIN_LATEST_COMMIT_TIME}"
          } > release-body.md

          if [ "$HAS_UPDATE" = "true" ] && [ -s changelog.txt ]; then
            echo "" >> release-body.md
            echo "## 本次同步更新（全部提交）" >> release-body.md
            echo "" >> release-body.md
            sed '/^$/d; s/^/- /' changelog.txt >> release-body.md
          fi

          cat >> release-body.md << 'BODY_EOF'

          ## 下载说明
          | 架构版本 | 适用设备 |
          |--------|----------|
          | `universal` | 推荐所有用户使用，兼容全部安卓设备 |
          | `arm64-v8a` | 64位ARM架构，绝大多数新款安卓手机 |
          | `armeabi-v7a` | 32位ARM架构，老旧安卓设备 |
          | `x86_64` | 64位x86架构，部分安卓模拟器 |
          | `x86` | 32位x86架构，极少老旧模拟器 |

          > 安装完成后，请在LSPosed框架中激活模块并重启设备生效。
          BODY_EOF

          echo "Release说明文件已生成"
          cat release-body.md

      - name: 创建GitHub Release（所有APK单独展示 + 完整更新日志）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_assets.outputs.tag_name }}
          name: Sesame-AG v${{ steps.prepare_assets.outputs.version }}
          make_latest: true
          generate_release_notes: false
          files: |
            ${{ env.ASSET_DIR }}/*.apk
            ${{ env.ASSET_DIR }}/*.sha256
          body_path: release-body.md

      - name: 清理旧版本（保留最近50个）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          KEEP_LATEST: 50
        run: |
          releases=$(curl -sS -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$REPO/releases?per_page=100" | \
            jq -r '.[] | select(.tag_name | startswith("v")) | "\(.created_at)\t\(.id)\t\(.tag_name)"' | \
            sort -r)

          count=$(printf '%s\n' "$releases" | sed '/^$/d' | wc -l)
          delete_count=$((count - KEEP_LATEST))

          if [ "$delete_count" -le 0 ]; then
            echo "当前只有 $count 个版本，无需清理"
            exit 0
          fi

          echo "共 $count 个版本，保留最近 $KEEP_LATEST 个，删除 $delete_count 个旧版本"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          printf '%s\n' "$releases" | sed '/^$/d' | tail -n "$delete_count" | while IFS=$'\t' read -r _created release_id tag_name; do
            echo "  删除版本: $tag_name" >> "$GITHUB_STEP_SUMMARY"
            curl -sS -f -X DELETE -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/$REPO/releases/$release_id" || true
            curl -sS -f -X DELETE -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/$REPO/git/refs/tags/$tag_name" || true
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "旧版本清理完成" >> "$GITHUB_STEP_SUMMARY"

  # 任务3：发送邮件通知
  notify-email:
    runs-on: ubuntu-latest
    needs: [ sync-upstream, build-and-sign ]
    if: ${{ always() && needs.build-and-sign.result != 'skipped' }}
    steps:
      - name: 下载更新日志
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: changelog

      - name: 生成邮件内容
        id: gen_email
        env:
          BUILD_RESULT: ${{ needs.build-and-sign.result }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          TAG_NAME: ${{ needs.build-and-sign.outputs.tag_name }}
          VERSION: ${{ needs.build-and-sign.outputs.version }}
          BUILD_TIME: ${{ needs.build-and-sign.outputs.build_time }}
          DEV_LATEST_COMMIT: ${{ needs.build-and-sign.outputs.dev_latest_commit }}
          DEV_LATEST_COMMIT_MSG: ${{ needs.build-and-sign.outputs.dev_latest_commit_msg }}
          DEV_LATEST_COMMIT_TIME: ${{ needs.build-and-sign.outputs.dev_latest_commit_time }}
          MAIN_LATEST_COMMIT: ${{ needs.build-and-sign.outputs.main_latest_commit }}
          MAIN_LATEST_COMMIT_MSG: ${{ needs.build-and-sign.outputs.main_latest_commit_msg }}
          MAIN_LATEST_COMMIT_TIME: ${{ needs.build-and-sign.outputs.main_latest_commit_time }}
          HAS_UPDATE: ${{ needs.sync-upstream.outputs.has_update }}
        run: |
          if [ "$BUILD_RESULT" = "success" ]; then
            SUBJECT="Sesame-AG 新版本构建发布成功"
            {
              echo "Sesame-AG 新版本已成功构建并发布！"
              echo ""
              echo "下载地址：${SERVER_URL}/${REPOSITORY}/releases/tag/${TAG_NAME}"
              echo ""
              echo "版本信息"
              echo "- 版本号：${VERSION}"
              echo "- 构建时间：${BUILD_TIME}"
              echo ""
              echo "原仓库最新提交"
              echo ""
              echo "【dev 分支】"
              echo "- 提交哈希：${DEV_LATEST_COMMIT}"
              echo "- 提交说明：${DEV_LATEST_COMMIT_MSG}"
              echo "- 提交时间：${DEV_LATEST_COMMIT_TIME}"
              echo ""
              echo "【main 分支】"
              echo "- 提交哈希：${MAIN_LATEST_COMMIT}"
              echo "- 提交说明：${MAIN_LATEST_COMMIT_MSG}"
              echo "- 提交时间：${MAIN_LATEST_COMMIT_TIME}"
            } > email-body.txt
          else
            SUBJECT="Sesame-AG 构建失败"
            {
              echo "Sesame-AG 构建流程出现失败，请查看详情排查。"
              echo ""
              echo "错误日志：${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID}"
              echo ""
              echo "常见失败原因"
              echo "1. patches/*.patch 与上游代码上下文不匹配"
              echo "2. 依赖下载失败（网络问题）"
              echo "3. 签名密钥配置错误"
              echo "4. 原仓库代码变更导致编译失败"
              echo ""
              echo "排查建议"
              echo "点击上方链接进入构建详情，查看红色报错步骤的具体日志"
              echo "若为网络问题，点击右上角 Re-run jobs 重新执行即可"
            } > email-body.txt
          fi

          if [ "$HAS_UPDATE" = "true" ] && [ -s changelog.txt ]; then
            echo "" >> email-body.txt
            echo "本次同步全部提交" >> email-body.txt
            sed '/^$/d; s/^/- /' changelog.txt >> email-body.txt
          fi

          echo "subject=${SUBJECT}" >> "$GITHUB_OUTPUT"

      - name: 发送构建结果邮件
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.qq.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          to: ${{ secrets.EMAIL_RECEIVER }}
          from: GitHub Actions <${{ secrets.EMAIL_USERNAME }}>
          subject: ${{ steps.gen_email.outputs.subject }}
          body: file://email-body.txt

  # 任务4：构建失败摘要补充
  notify-failure:
    runs-on: ubuntu-latest
    needs: [ sync-upstream, build-and-sign ]
    if: ${{ failure() }}
    steps:
      - name: 输出失败提示
        run: |
          echo "## 构建执行失败" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "请点击左侧失败的任务步骤，查看红色报错的详细日志信息。" >> "$GITHUB_STEP_SUMMARY"
          echo "若补丁失败，更新 patches/unlimited-account.patch 后重新运行。" >> "$GITHUB_STEP_SUMMARY"
